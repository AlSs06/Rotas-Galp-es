<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rotas Galpões - Dashboard</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; background-color: #222; }
        
        #painel {
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px; 
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            width: 160px;
            box-sizing: border-box;
        }
        
        .btn-rota {
            display: block; 
            width: 100%; 
            margin-bottom: 8px; 
            padding: 10px;
            border: none; 
            border-radius: 4px; 
            color: white; 
            font-weight: bold;
            cursor: pointer; 
            text-align: center; 
            transition: opacity 0.2s;
            box-sizing: border-box;
        }
        .btn-rota:hover { opacity: 0.8; }
        #btn-vermelha { background-color: #FF0000; }
        #btn-verde { background-color: #00AA00; }
        #btn-azul { background-color: #0078FF; }
        #btn-amarela { background-color: #D4AF37; color: black; }

        .gps-marker { background: transparent; border: none; }
        #gps-arrow {
            width: 36px; height: 36px; transform-origin: center;
            transition: transform 0.1s linear; filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.8));
        }

        @media (max-width: 768px) {
            #painel {
                top: auto; 
                bottom: 25px; 
                left: 50%; 
                transform: translateX(-50%);
                width: 92%; 
                max-width: 400px;
                padding: 12px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            #painel h3 { 
                grid-column: span 2; 
                margin-bottom: 5px; 
            }
            .btn-rota { 
                margin-bottom: 0; 
                padding: 12px; 
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div id="painel">
        <h3 style="margin-top:0; font-size: 14px; text-align: center;">Rotas até os Galpões</h3>
        <button class="btn-rota" id="btn-vermelha" onclick="iniciarAnimacao('vermelha')">G3A</button>
        <button class="btn-rota" id="btn-verde" onclick="iniciarAnimacao('verde')">G3</button>
        <button class="btn-rota" id="btn-azul" onclick="iniciarAnimacao('azul')">G1</button>
        <button class="btn-rota" id="btn-amarela" onclick="iniciarAnimacao('amarela')">G2</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

    <script>
        window.onload = function() {
            const centroMapa = [-23.4227124, -46.8017848];
            
            // Margem de bloqueio expandida para evitar o erro do ecrã cinzento em monitores grandes e telemóveis
            const limites = L.latLngBounds(
                [centroMapa[0] - 0.02, centroMapa[1] - 0.02],
                [centroMapa[0] + 0.02, centroMapa[1] + 0.02]
            );

            const map = L.map('map', {
                zoomControl: false,
                maxBounds: limites,
                maxBoundsViscosity: 1.0,
