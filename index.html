<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rotas Galpões - Dashboard</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; background-color: #222; }
        
        #painel {
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px; 
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            width: 180px;
            box-sizing: border-box;
        }
        
        .rota-row {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }

        .btn-rota {
            flex-grow: 1;
            padding: 10px;
            border: none; 
            border-radius: 4px; 
            color: white; 
            font-weight: bold;
            cursor: pointer; 
            text-align: center; 
            transition: opacity 0.2s;
            box-sizing: border-box;
        }
        .btn-rota:hover { opacity: 0.8; }
        #btn-vermelha { background-color: #FF0000; }
        #btn-verde { background-color: #00AA00; }
        #btn-azul { background-color: #0078FF; }
        #btn-amarela { background-color: #D4AF37; color: black; }
